[package]
name = "ame_rag_plugin"
version = "0.1.0"
edition = "2021"

[lib]
name = "rag"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.23.0"
rustc-hash = "2.1.3"
sqlite-vec = "0.1.9"
sha2 = "0.11.0"
usearch = { version = "2.26.0", default-features = false }
regex = "1.13.1"
rust-embed = "8.12.0"
pdf-extract = "0.9.0"
unicode-normalization = "0.1.25"

[profile.release]
incremental = false
overflow-checks = false
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false

